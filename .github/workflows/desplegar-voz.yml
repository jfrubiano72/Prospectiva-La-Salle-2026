name: Desplegar la voz de Juana

# La voz ya no se fija aqui. Vive en la lista del propio Worker y se escoge en
# cada peticion, asi que cambiarla no exige volver a desplegar. Se retiro el
# parametro que antes prometia fijarla: no hacia nada y confundia.

on:
  workflow_dispatch:
  push:
    paths:
      - "worker-voz/**"
      - ".github/workflows/desplegar-voz.yml"

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar el Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker-voz
          secrets: |
            ELEVENLABS_API_KEY
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

      - name: Comprobar que quedo en pie
        run: |
          sleep 8
          echo "Estado del servicio:"
          curl -s --max-time 25 "https://voz-lasalle.jfrubiano.workers.dev/salud" || true
          echo
