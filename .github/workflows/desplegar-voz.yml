name: Desplegar la voz de Juana

on:
  workflow_dispatch:
    inputs:
      voz_id:
        description: "Identificador de la voz en ElevenLabs (dejar vacio para conservar la actual)"
        required: false
        default: ""
  push:
    paths:
      - "worker-voz/**"
      - ".github/workflows/desplegar-voz.yml"

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fijar la voz elegida
        if: inputs.voz_id != ''
        run: |
          cd worker-voz
          sed -i "s|^VOZ_ID = .*|VOZ_ID = \"${{ inputs.voz_id }}\"|" wrangler.toml
          echo "Voz fijada:"; grep VOZ_ID wrangler.toml

      - name: Publicar el Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker-voz
          secrets: |
            ELEVENLABS_API_KEY
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

      - name: Comprobar que quedo en pie
        run: |
          sleep 6
          curl -s "https://voz-lasalle.${{ secrets.CLOUDFLARE_SUBDOMINIO || 'jfrubiano' }}.workers.dev/salud" || true
          echo
